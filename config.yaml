klause:
  name: KLAUSE
  user_name: Ayush
  version: 0.1.0
  wake_word: klause
  personality: minimalist
ai:
  provider: nvidia
  nvidia_model: nvidia/nemotron-3-ultra-550b-a55b
  nvidia_base_url: https://integrate.api.nvidia.com/v1
  embedding_model: models/embedding-001
  max_tokens: 8192
  max_steps: 10
  routing_enabled: true
  fast_provider: gemini
  fast_model: gemini-3.1-flash-lite-preview
  complex_provider: nvidia
  complex_model: nvidia/nemotron-3-ultra-550b-a55b
memory:
  mongo_uri: mongodb://localhost:27017/
  mongo_db: klause
  chroma_path: ./data/chroma
  max_conversation_history: 100
voice:
  enabled: true
  mode: live
  trigger_mode: continuous
  hotkey: ctrl+space
  stt_engine: whisper
  tts_engine: sapi
  max_spoken_sentences: 3
  speaking_rate: 0
  live:
    model: gemini-3.8-live
    voice_name: Puck
    rotation_token_limit: 45000
    rotation_turn_limit: 40
    sample_rate_in: 16000
    sample_rate_out: 24000
    barge_in: true
  live_typer:
    hotkey: ctrl+shift+v
    chunk_seconds: 2
    max_duration_seconds: 300
google_search_api_key: ''
google_search_cx: ''
serper_api_key: ''
paths:
  knowledge_base: ./knowledge_base
  projects: ./projects
  logs: ./logs
allowed_applications:
  notepad: notepad.exe
  calc: calc.exe
  explorer: explorer.exe
  cmd: cmd.exe
  mspaint: mspaint.exe
  taskmgr: taskmgr.exe
  chrome: C:/Program Files/Google/Chrome/Application/chrome.exe
  brave: C:/Program Files/BraveSoftware/Brave-Browser/Application/brave.exe
state_machine:
  enabled: true
  capture_clipboard: true
  max_visible_windows: 10
automation:
  enabled: true
  polling_interval_seconds: 0.5
  debounce_interval_seconds: 0.3
  max_rules: 50
browser:
  prefer: brave
  profile_directory: Default
desktop_macro:
  enabled: false
