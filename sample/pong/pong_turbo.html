<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Pong Turbo Edition</title>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
    <style>
        canvas { background: #000; border: 4px solid #fff; box-shadow: 0 0 20px rgba(0,255,255,0.5); }
        .retro-font { font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 2.5rem; }
    </style>
</head>
<body class='bg-dark text-white min-vh-100 d-flex flex-column align-items-center justify-content-center'>
    <div class='container mb-4'>
        <div class='card bg-dark border-light text-white shadow-lg mx-auto' style='max-width: 600px;'>
            <div class='card-header text-center border-light'><h5>PONG TURBO DASHBOARD</h5></div>
            <div class='card-body d-flex justify-content-between align-items-center px-5'>
                <div class='text-start'>
                    <div class='small text-muted'>PLAYER</div>
                    <div id='pScore' class='retro-font text-primary'>0</div>
                </div>
                <div class='text-end'>
                    <div class='small text-muted'>CPU</div>
                    <div id='cScore' class='retro-font text-danger'>0</div>
                </div>
            </div>
        </div>
    </div>
    <canvas id='gameCanvas' width='800' height='600'></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let pScore = 0, cScore = 0;
        const ball = { x: 400, y: 300, dx: 7, dy: 7, radius: 10 };
        const paddle = { w: 10, h: 100, y: 250 };
        const cpu = { w: 10, h: 100, y: 250 };
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            paddle.y = e.clientY - rect.top - paddle.h / 2;
        });
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.fillRect(0, paddle.y, paddle.w, paddle.h);
            ctx.fillRect(canvas.width - cpu.w, cpu.y, cpu.w, cpu.h);
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ball.x += ball.dx; ball.y += ball.dy;
            if(ball.y < 0 || ball.y > canvas.height) ball.dy *= -1;
            if(ball.x < paddle.w && ball.y > paddle.y && ball.y < paddle.y + paddle.h) { ball.dx *= -1.1; }
            if(ball.x > canvas.width - cpu.w && ball.y > cpu.y && ball.y < cpu.y + cpu.h) { ball.dx *= -1.1; }
            if(ball.x < 0) { cScore++; updateScore(); reset(); }
            else if(ball.x > canvas.width) { pScore++; updateScore(); reset(); }
            cpu.y += (ball.y - (cpu.y + cpu.h / 2)) * 0.1;
            requestAnimationFrame(draw);
        }
        function updateScore() {
            document.getElementById('pScore').innerText = pScore;
            document.getElementById('cScore').innerText = cScore;
        }
        function reset() {
            ball.x = 400; ball.y = 300; ball.dx = 7 * (Math.random() > 0.5 ? 1 : -1); ball.dy = 7 * (Math.random() > 0.5 ? 1 : -1);
        }
        draw();
    </script>
</body>
</html>
