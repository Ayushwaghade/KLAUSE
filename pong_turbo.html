<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Pong Turbo Edition</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'><style>body { background: #1a1a1a; color: white; } canvas { background: #000; border: 2px solid #00ffff; box-shadow: 0 0 15px rgba(0,255,255,0.3); max-width: 100%; height: auto; display: block; margin: 0 auto; }</style></head><body class='bg-dark text-white min-vh-100 d-flex flex-column align-items-center justify-content-center'><div class='container p-4'><div class='card bg-secondary text-white mb-4'><div class='card-body d-flex justify-content-between align-items-center'><h1>Player: <span id='pScore'>0</span></h1><div class='text-center'><h2 id='timer'>00:00</h2><span class='badge bg-info text-dark' id='speedLevel'>Speed Level: 1</span></div><h1>CPU: <span id='cScore'>0</span></h1></div></div><canvas id='gameCanvas' width='800' height='500' class='img-fluid'></canvas><div class='mt-3 d-flex justify-content-center gap-2'><button id='pauseBtn' class='btn btn-primary'>Pause</button><button id='resetBtn' class='btn btn-outline-danger'>Reset Game</button><select id='difficulty' class='form-select w-auto'><option value='0.05'>Easy</option><option value='0.1' selected>Medium</option><option value='0.2'>Impossible</option></select></div></div><div class='modal fade' id='winModal' tabindex='-1' data-bs-backdrop='static'><div class='modal-dialog modal-dialog-centered'><div class='modal-content bg-dark text-white border-info'><div class='modal-header'><h5 class='modal-title' id='winTitle'>Game Over</h5></div><div class='modal-body text-center'><h2 id='winMessage'></h2></div><div class='modal-footer justify-content-center'><button id='playAgainBtn' class='btn btn-success'>Play Again</button></div></div></div></div><script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js'></script><script>const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d'); let pScore = 0, cScore = 0, frames = 0, seconds = 0, speedLevel = 1, paused = false, gameOver = false, shakeDuration = 0; let lastTime = 0; const ball = { x: 400, y: 250, dx: 400, dy: 400, radius: 10 }, paddle = { w: 10, h: 100, y: 200 }, cpu = { w: 10, h: 100, y: 200 }; const winModal = new bootstrap.Modal(document.getElementById('winModal')); document.getElementById('pauseBtn').onclick = () => paused = !paused; document.getElementById('resetBtn').onclick = reset; document.getElementById('playAgainBtn').onclick = () => { reset(true); winModal.hide(); }; window.addEventListener('keydown', (e) => { if(['ArrowUp','ArrowDown','w','s'].includes(e.key)) e.preventDefault(); if(!paused && !gameOver) { if(e.key === 'ArrowUp' || e.key === 'w') paddle.y = Math.max(0, paddle.y - 30); if(e.key === 'ArrowDown' || e.key === 's') paddle.y = Math.min(canvas.height - paddle.h, paddle.y + 30); } }); function triggerShake(dur) { shakeDuration = dur; } function handleCollision(p) { let collidePoint = ball.y - (p.y + paddle.h / 2); collidePoint = collidePoint / (paddle.h / 2); let angleRad = (Math.PI / 4) * collidePoint; let direction = (ball.x < canvas.width / 2) ? 1 : -1; ball.dx = direction * Math.abs(ball.dx * 1.1) * Math.cos(angleRad); ball.dy = Math.abs(ball.dy * 1.1) * Math.sin(angleRad); if(Math.abs(ball.dx) > 600) triggerShake(10); speedLevel = Math.min(Math.floor(Math.abs(ball.dx) / 100), 10); document.getElementById('speedLevel').innerText = `Speed Level: ${speedLevel}`; } function update(dt) { if(paused || gameOver) return; ball.x += ball.dx * dt; ball.y += ball.dy * dt; if(ball.y < 0 || ball.y > canvas.height) { ball.dy *= -1; ball.y = Math.max(0, Math.min(canvas.height, ball.y)); } if(ball.x < paddle.w && ball.y > paddle.y && ball.y < paddle.y + paddle.h) handleCollision(paddle); else if(ball.x > canvas.width - cpu.w && ball.y > cpu.y && ball.y < cpu.y + cpu.h) handleCollision(cpu); if(ball.x < 0) { cScore++; triggerShake(20); document.getElementById('cScore').innerText = cScore; checkWin(); reset(); } else if(ball.x > canvas.width) { pScore++; triggerShake(20); document.getElementById('pScore').innerText = pScore; checkWin(); reset(); } const diff = parseFloat(document.getElementById('difficulty').value); cpu.y += (ball.y - (cpu.y + cpu.h / 2)) * diff; frames++; if(frames % 60 === 0) { seconds++; const m = Math.floor(seconds / 60), s = seconds % 60; document.getElementById('timer').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; } } function checkWin() { if(pScore >= 10 || cScore >= 10) { gameOver = true; document.getElementById('winMessage').innerText = pScore >= 10 ? 'Player Wins!' : 'AI Wins!'; winModal.show(); } } function draw() { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.save(); if(shakeDuration > 0) { ctx.translate((Math.random()-0.5)*15, (Math.random()-0.5)*15); shakeDuration--; } ctx.fillStyle = 'white'; ctx.fillRect(0, paddle.y, paddle.w, paddle.h); ctx.fillRect(canvas.width - cpu.w, cpu.y, cpu.w, cpu.h); ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore(); } function loop(timestamp) { const dt = (timestamp - lastTime) / 1000; lastTime = timestamp; update(Math.min(dt, 0.1)); draw(); requestAnimationFrame(loop); } function reset(fullReset = false) { ball.x = 400; ball.y = 250; ball.dx = 400 * (Math.random() > 0.5 ? 1 : -1); ball.dy = 400 * (Math.random() > 0.5 ? 1 : -1); if(fullReset) { pScore = 0; cScore = 0; seconds = 0; gameOver = false; document.getElementById('pScore').innerText = '0'; document.getElementById('cScore').innerText = '0'; } speedLevel = 1; document.getElementById('speedLevel').innerText = `Speed Level: ${speedLevel}`; } requestAnimationFrame(loop);</script></body></html>
