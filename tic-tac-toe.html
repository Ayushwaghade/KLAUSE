<!DOCTYPE html><html><head><title>Tic-Tac-Toe</title><style>body{text-align:center;font-family:sans-serif;}#board{display:grid;grid-template-columns:repeat(3,100px);gap:5px;justify-content:center;margin-top:20px;}.cell{width:100px;height:100px;border:1px solid #000;display:flex;align-items:center;justify-content:center;font-size:2em;cursor:pointer;}</style></head><body><h1>Tic-Tac-Toe</h1><div id="board"></div><script>const board=document.getElementById('board');let turn='X';const cells=Array(9).fill(null);function render(){board.innerHTML='';cells.forEach((val,i)=>{const div=document.createElement('div');div.className='cell';div.innerText=val||'';div.onclick=()=>makeMove(i);board.appendChild(div);});}function makeMove(i){if(!cells[i]){cells[i]=turn;turn=turn==='X'?'O':'X';render();}}render();</script></body></html>
